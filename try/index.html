<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나비 — 받은 서류함</title>
<meta name="description" content="나비 앱 화면 — 받은 서류함 · 확인 큐 · 정리된 서류 · 거래처 · 기기. 체험 인스턴스에서는 샘플 서류 22건을 소형 언어모델이 라벨링한 결과를 그대로 보여주고, 승인하면 표준 폴더로 정리됩니다. 외부 API 호출 0.">
<!-- 체험 인스턴스 주소(쉼표로 여러 개, 앞이 우선) — 같은 origin(./api)이 먼저, 안 되면 이 주소들을 차례로, 다 안 되면 recorded.json 읽기 전용 -->
<meta name="nabi-api" content="https://n100-minipc.tailb0e058.ts.net/, https://turtle-jiwoo.tailb0e058.ts.net/">
<link rel="stylesheet" href="../assets/app.css">
<style>
  /* 이 화면만의 소소한 것 — 공용 규격은 ../assets/app.css */
  .chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 .9rem;align-items:center}
  .chips .chip{font:inherit;font-size:.82rem;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);
               border-radius:999px;padding:.35rem .75rem;cursor:pointer}
  .chips .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chips .chip .cnt{font-weight:500;opacity:.7;margin-left:.25rem}
  .chips .right{margin-left:auto;font-size:.82rem;color:var(--muted)}
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:0 0 .9rem}
  .sec-head h2{font-size:1rem;margin:0}
  .sec-head .sub{font-size:.84rem;color:var(--muted);margin:.15rem 0 0}
  .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.45rem 1.2rem;font-size:.9rem;margin:0}
  .kv dt{color:var(--muted);white-space:nowrap}
  .kv dd{margin:0;font-variant-numeric:tabular-nums}
  .mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin:0 0 1rem}
  .mini>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.6rem .8rem}
  .mini .l{font-size:.76rem;color:var(--muted)}
  .mini .n{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .mini .n small{font-size:.75rem;color:var(--muted);font-weight:600}
  .acc{display:grid;gap:.55rem}
  .acc .b{display:grid;grid-template-columns:5.2rem minmax(0,1fr) 4.2rem;gap:.6rem;align-items:center;font-size:.86rem}
  .acc .track{height:.5rem;background:var(--gray-bg);border-radius:999px;overflow:hidden}
  .acc .fill{height:100%;background:var(--green);border-radius:999px}
  .acc .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .note{font-size:.8rem;color:var(--muted);margin:.8rem 0 0}
  .ready-list td .btn{margin:-.2rem 0}
  .tree details{margin:0}
  .tree summary{list-style:none}
  .tree summary::-webkit-details-marker{display:none}
  .tree details > summary .chev{transition:transform .12s}
  .tree details[open] > summary .chev{transform:rotate(90deg)}
</style>
</head>
<body class="app">

  <symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>

  <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>

  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>

  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>

  <symbol id="i-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
</svg>

<aside class="sidebar" aria-label="메뉴">
  <a class="brand" href="../"><svg class="mark" aria-hidden="true"><use href="#i-logo"/></svg>나비</a>
  <nav id="nav">
    <a href="#/dashboard" data-route="dashboard"><svg class="ico" aria-hidden="true"><use href="#i-dashboard"/></svg>대시보드</a>
    <a href="#/inbox" data-route="inbox"><svg class="ico" aria-hidden="true"><use href="#i-inbox"/></svg>받은 서류함<span class="cnt" id="n-inbox"></span></a>
    <a href="#/queue" data-route="queue"><svg class="ico" aria-hidden="true"><use href="#i-clock"/></svg>확인 큐<span class="cnt badge badge-held" id="n-queue" hidden></span></a>
    <a href="#/organized" data-route="organized"><svg class="ico" aria-hidden="true"><use href="#i-folder"/></svg>정리된 서류<span class="cnt" id="n-org"></span></a>
    <a href="#/clients" data-route="clients"><svg class="ico" aria-hidden="true"><use href="#i-users"/></svg>거래처</a>
    <a href="#/device" data-route="device"><svg class="ico" aria-hidden="true"><use href="#i-cpu"/></svg>기기</a>
  </nav>
  <div class="inst" id="inst"></div>
</aside>

<div class="app-banner banner banner-amber" id="banner" hidden><svg class="ico" aria-hidden="true"><use href="#i-alert"/></svg><span id="banner-text"></span></div>

<header class="topbar">
  <h1 id="title">대시보드</h1>
  <div class="search"><svg class="ico sm" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="q" placeholder="파일명 · 거래처 · 서류 종류" aria-label="검색"></div>
  <div class="actions">
    <button class="btn btn-secondary btn-sm" id="scan" hidden><svg class="ico sm" aria-hidden="true"><use href="#i-scan"/></svg>받은 서류함 스캔</button>
    <button class="btn btn-secondary btn-sm" id="undo" disabled><svg class="ico sm" aria-hidden="true"><use href="#i-undo"/></svg>마지막 이동 되돌리기</button>
  </div>
</header>

<main class="main" id="main"><div class="empty">불러오는 중…</div></main>

<aside class="drawer" id="drawer" aria-label="서류 상세" aria-hidden="true"></aside>
<div class="toast-wrap" id="toasts"></div>

<script>
(function(){
  'use strict';
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const BASE = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
  // 인스턴스 주소 — 같은 origin(./api)이 먼저, 안 되면 <meta name="nabi-api">의 주소들을 차례로, 다 안 되면 recorded.json 읽기 전용
  const META_APIS = ((document.querySelector('meta[name="nabi-api"]') || {}).content || '').split(/[\s,]+/).filter(Boolean);
  let apiBase = BASE;                                   // 지금 쓰는 API 주소(끝에 /)
  const crossOrigin = () => apiBase !== BASE;
  const skey = () => 'nabi.session@' + apiBase;
  // 정적 호스팅에서 인스턴스를 부르면 제3자 쿠키가 막힐 수 있어 세션을 헤더로 되돌려 준다
  function savedSession() { try { return crossOrigin() ? (localStorage.getItem(skey()) || '') : ''; } catch (e) { return ''; } }
  function remember(tok) { if (!crossOrigin() || !tok) return; try { localStorage.setItem(skey(), tok); } catch (e) {} }
  const HOW = {exact: '등록 거래처명과 일치', alias: '등록된 별칭으로 대조', fuzzy: '등록 목록과 근사 매칭', none: '등록 목록에 없음'};
  const STATE = {ready: '확정', held: '보류', approved: '이동완료', rejected: '거절', skipped: '건너뜀'};
  const AXES = [['client', '거래처'], ['category', '분류'], ['doc_type', '서류 종류'], ['period', '기간']];
  const TITLES = {dashboard: '대시보드', inbox: '받은 서류함', queue: '확인 큐', organized: '정리된 서류', clients: '거래처', device: '기기'};
  const REASON = {category_mismatch: '모델이 고른 분류가 서류 종류와 다르다', period_cycle: '기간 형식이 서류의 주기와 맞지 않다',
                  client_unregistered: '거래처가 등록 목록에 없다', doc_type_unknown: '서류 종류가 어휘에 없다',
                  ocr_low: 'OCR 글자가 적다', model_failed: '모델이 실패했다', parse_failed: '본문을 뽑지 못했다'};

  let st = null;            // 서버 상태
  let readonly = false;     // 인스턴스가 없어 미리 잰 결과만 보는 중
  let route = 'dashboard';
  let selected = null;      // 드로어에 열린 서류 id
  let filter = 'all';       // 받은 서류함 상태 필터
  let query = '';
  let es = null;            // 진행 스트림
  let lastTree = new Set();

  // ---------------------------------------------------------- 서버
  async function api(path, opts) {
    const o = Object.assign({credentials: crossOrigin() ? 'omit' : 'same-origin'}, opts || {});
    const tok = savedSession();
    if (tok) o.headers = Object.assign({}, o.headers || {}, {'X-Nabi-Session': tok});
    const r = await fetch(apiBase + 'api' + path, o);
    let body = null;
    try { body = await r.json(); } catch (e) { body = null; }
    if (!r.ok) throw new Error((body && body.error) || ('HTTP ' + r.status));
    if (body && body.session) remember(body.session);
    return body;
  }
  const post = (path, data) => api(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data || {})});

  async function load() {
    const here = new URL(BASE, location.href).href;
    const bases = [BASE];
    for (const m of META_APIS) { const u = new URL(m.endsWith('/') ? m : m + '/', location.href).href; if (u !== here && !bases.includes(u)) bases.push(u); }
    let got = null;
    for (const b of bases) {
      apiBase = b;
      try { got = await api('/state'); break; } catch (e) { got = null; }
    }
    window.nabiApiBase = got ? apiBase : null;           // 검수 스크립트(tools/live_check.js)가 읽는다
    if (got) {
      st = got;
      readonly = false;
      $('#banner').hidden = true;
    } else {
      // 체험 인스턴스가 없다 — 정적 파일의 미리 잰 결과만 읽기 전용으로 보여준다
      apiBase = BASE;
      const rec = await (await fetch(BASE + 'recorded.json', {cache: 'no-cache'})).json();
      st = offline(rec);
      readonly = true;
      $('#banner').hidden = false;
      $('#banner-text').textContent = '체험 인스턴스가 응답하지 않습니다 — 미리 잰 결과만 읽기 전용으로 보여드립니다. 승인·되돌리기·다시 재기는 지금 할 수 없습니다.';
    }
    render();
  }

  function offline(rec) {
    const docs = rec.docs.map(d => Object.assign({}, d.row, {
      sample: {id: d.sample_id, kind: d.kind, note: d.note, want: d.want}, text_head: d.text_head, live: false}));
    const registry = Array.from(new Set(rec.docs.map(d => d.want.client))).sort();
    const doc_types = Array.from(new Set(rec.docs.map(d => d.want.doc_type))).sort();
    return {mode: 'demo', recorded: rec.meta, device: rec.meta.device, model_alive: false, queue_len: 0,
            docs, tree: [], moves: 0, registry, vocab: {doc_types, categories: []}};
  }

  // ---------------------------------------------------------- 데이터 도우미
  const byId = id => st.docs.find(x => x.id === id);
  const kindOf = d => d.sample ? d.sample.kind : (d.ext || '').toUpperCase();
  const fmtTs = ts => (ts || '').replace('T', ' ').slice(0, 16);
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  function counts() {
    const c = {total: st.docs.length, ready: 0, held: 0, approved: 0, rejected: 0, live: 0};
    for (const d of st.docs) { if (c[d.state] != null) c[d.state]++; if (d.live) c.live++; }
    return c;
  }
  function matches(d) {
    if (!query) return true;
    const q = query.toLowerCase();
    return [d.name, d.client, d.doc_type, d.period, d.pred && d.pred.client, kindOf(d)].some(v => v && String(v).toLowerCase().includes(q));
  }
  function labelLine(d) {
    const c = d.client || (d.pred && d.pred.client) || '';
    const t = d.doc_type || (d.pred && d.pred.doc_type) || '';
    const p = d.period || (d.pred && d.pred.period) || '';
    return [c, t, p].filter(Boolean).join(' · ');
  }
  function reasonText(d) {
    if (d.explain && d.explain.length) return d.explain;
    return (d.reasons || []).map(r => REASON[r] || r);
  }
  function badge(state) { return '<span class="badge badge-' + state + '">' + (STATE[state] || state) + '</span>'; }
  function timing(d) {
    const parts = [];
    if (d.live) parts.push('지금 이 기기에서 잰 값' + (d.live_at ? ' · ' + fmtTs(d.live_at) : ''));
    else if (st.recorded && st.recorded.device) parts.push('미리 잰 값 · ' + st.recorded.device + (st.recorded.recorded_at ? ' · ' + fmtTs(st.recorded.recorded_at) : ''));
    if (d.label_s) parts.push('모델 ' + d.label_s.toFixed(1) + '초');
    if (d.wall_s) parts.push('전체 ' + d.wall_s.toFixed(1) + '초');
    if (d.prompt_n) parts.push('프롬프트 ' + d.prompt_n + '토큰');
    if (d.pp_tps) parts.push('pp ' + d.pp_tps.toFixed(1) + ' / tg ' + (d.tg_tps || 0).toFixed(1) + ' tok/s');
    if (d.model) parts.push(d.model);
    return parts.map(esc).map(s => '<span>' + s + '</span>').join(' · ');
  }
  function activity() {
    const ev = [];
    for (const d of st.docs) {
      if (d.state === 'approved') ev.push({t: d.ts, what: d.fixed_by_human ? '라벨을 고쳐서 승인 · 이동' : '승인 · 이동', d, cls: 'approved'});
      else if (d.state === 'rejected') ev.push({t: d.ts, what: '거절', d, cls: 'rejected'});
      else if (d.fixed_by_human) ev.push({t: d.ts, what: '라벨 수정', d, cls: 'ready'});
      if (d.live && d.live_at) ev.push({t: d.live_at, what: '이 기기에서 다시 잼 · ' + (d.label_s || 0).toFixed(1) + '초', d, cls: 'live'});
    }
    return ev.sort((a, b) => (b.t || '').localeCompare(a.t || ''));
  }

  // ---------------------------------------------------------- 그리기
  function render() {
    const c = counts();
    $('#n-inbox').textContent = c.total;
    const nq = $('#n-queue');
    nq.textContent = c.held; nq.hidden = !c.held;
    $('#n-org').textContent = c.approved || '';
    $$('#nav a').forEach(a => { if (a.dataset.route === route) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    $('#title').textContent = TITLES[route] || '';
    document.title = '나비 — ' + (TITLES[route] || '');
    $('#undo').disabled = readonly || !c.approved;
    $('#scan').hidden = st.mode !== 'local' || readonly;
    renderInst();
    const main = $('#main');
    main.scrollTop = 0;
    ({dashboard: renderDashboard, inbox: renderInbox, queue: renderQueue, organized: renderOrganized,
      clients: renderClients, device: renderDevice}[route] || renderDashboard)(main, c);
    if (selected) renderDrawer();
  }

  function renderInst() {
    const m = st.recorded || {};
    let h = '<b title="' + esc(st.device || m.device || '') + '">' + esc(st.device || m.device || '기기 미상') + '</b>';
    h += '<div>' + esc(m.model_file || st.model || '') + (m.threads ? ' · ' + m.threads + '스레드' : '') + '</div>';
    if (readonly) h += '<div class="state"><span class="dot off"></span>인스턴스 미응답 · 기록만</div>';
    else h += '<div class="state"><span class="dot ' + (st.model_alive ? 'on' : 'off') + '"></span>' + (st.model_alive ? '모델 응답 중' : '모델 미응답') + ' · 대기 ' + st.queue_len + '건</div>';
    if (st.mode === 'demo') {
      h += '<div class="demo"><span class="badge badge-gray">체험 모드</span><span>샘플 ' + st.docs.length + '건 · 방문자별 샌드박스</span>'
         + (readonly ? '' : '<a href="#" id="reset">처음부터 다시</a>') + '</div>';
    } else {
      h += '<div class="demo"><span class="badge badge-gray">로컬 모드</span><span>이 PC의 작업공간</span></div>';
    }
    $('#inst').innerHTML = h;
    const r = $('#reset');
    if (r) r.addEventListener('click', async ev => {
      ev.preventDefault();
      try { await post('/reset'); selected = null; closeDrawer(); await load(); toast('새 샌드박스를 받았습니다', 'ok'); }
      catch (e) { toast(e.message, 'err'); }
    });
  }

  function renderDashboard(main, c) {
    const times = st.docs.map(d => d.label_s).filter(Boolean);
    const avg = times.length ? times.reduce((a, b) => a + b, 0) / times.length : 0;
    let h = '<section>';
    h += '<div class="stats">'
      + tile('받은 서류', c.total, '', kindsLine())
      + tile('확정', c.ready, 'green', '승인하면 바로 표준 폴더로')
      + tile('보류', c.held, 'amber', '사람이 확인해야 합니다')
      + tile('이동 완료', c.approved, 'blue', c.approved ? '되돌릴 수 있습니다' : '아직 옮긴 서류가 없습니다')
      + '</div>';

    // 보류 사유 분포 + 최근 활동
    const reasons = {};
    for (const d of st.docs) if (d.state === 'held') for (const r of (d.reasons || [])) reasons[r] = (reasons[r] || 0) + 1;
    const rs = Object.entries(reasons).sort((a, b) => b[1] - a[1]);
    const held = c.held || 1;
    h += '<div class="two">';
    h += '<div class="card"><div class="card-head"><h3>보류 사유</h3><span class="muted small">보류 ' + c.held + '건 · 사유는 겹칠 수 있습니다</span></div>';
    if (!rs.length) h += '<div class="empty" style="padding:1.5rem 0">보류된 서류가 없습니다</div>';
    else {
      h += '<div class="bars">' + rs.map(([r, n]) => '<div class="b"><div><div class="t"><span>' + esc(REASON[r] || r) + '</span></div>'
        + '<div class="track"><div class="fill" style="width:' + pct(n, held) + '%"></div></div></div><div class="v">' + n + '건</div></div>').join('') + '</div>';
      h += '<p class="note">보류는 오류가 아니라 정식 출력입니다 — 확신이 낮으면 옮기지 않고 사람에게 넘깁니다. <a href="#/queue">확인 큐</a>에서 고쳐서 승인할 수 있습니다.</p>';
    }
    h += '</div>';
    const ev = activity().slice(0, 8);
    h += '<div class="card"><div class="card-head"><h3>최근 활동</h3><span class="muted small">이 세션</span></div>';
    if (!ev.length) h += '<div class="empty" style="padding:1.5rem 0">아직 활동이 없습니다 — 확인 큐에서 승인하면 여기에 쌓입니다</div>';
    else h += '<ul class="feed">' + ev.map(e => '<li><span class="badge badge-' + e.cls + '">' + esc(e.what.split(' · ')[0]) + '</span>'
      + '<span><a href="#" class="f open-doc" data-id="' + esc(e.d.id) + '">' + esc(e.d.name) + '</a>'
      + (e.what.includes(' · ') ? ' <span class="muted">' + esc(e.what.slice(e.what.indexOf(' · ') + 3)) + '</span>' : '') + '</span>'
      + '<span class="when">' + esc(fmtTs(e.t)) + '</span></li>').join('') + '</ul>';
    h += '</div></div>';

    // 처리 시간 + 샘플 정답 대조
    h += '<div class="two">';
    h += '<div class="card"><div class="card-head"><h3>처리 시간</h3><span class="muted small">서류 1건에 모델이 쓴 시간</span></div>';
    if (!times.length) h += '<div class="empty" style="padding:1.5rem 0">아직 잰 값이 없습니다</div>';
    else {
      h += '<div class="mini"><div><div class="l">평균</div><div class="n">' + avg.toFixed(1) + '<small>초</small></div></div>'
        + '<div><div class="l">최소</div><div class="n">' + Math.min(...times).toFixed(1) + '<small>초</small></div></div>'
        + '<div><div class="l">최대</div><div class="n">' + Math.max(...times).toFixed(1) + '<small>초</small></div></div></div>';
      const buckets = [[0, 15, '15초 미만'], [15, 20, '15～20초'], [20, 25, '20～25초'], [25, 1e9, '25초 이상']];
      h += '<div class="bars">' + buckets.map(([lo, hi, name]) => { const n = times.filter(t => t >= lo && t < hi).length;
        return '<div class="b"><div><div class="t"><span>' + name + '</span></div><div class="track"><div class="fill" style="background:var(--green);width:' + pct(n, times.length) + '%"></div></div></div><div class="v">' + n + '건</div></div>'; }).join('') + '</div>';
      const m = st.recorded || {};
      h += '<p class="note">' + (c.live ? '지금 잰 값 ' + c.live + '건 포함. ' : '') + '미리 잰 값은 ' + esc(m.device || '') + (m.recorded_at ? ' · ' + esc(fmtTs(m.recorded_at)) : '') + ' 기준입니다.</p>';
    }
    h += '</div>';
    h += sampleCard();
    h += '</div></section>';
    main.innerHTML = h;
    $$('.open-doc', main).forEach(a => a.addEventListener('click', ev => { ev.preventDefault(); openDoc(a.dataset.id); }));
  }

  function kindsLine() {
    const kinds = {};
    for (const d of st.docs) { const k = kindOf(d); if (k) kinds[k] = (kinds[k] || 0) + 1; }
    const ks = Object.keys(kinds);
    return ks.length ? ks.length + '종 형식 · ' + ks.slice(0, 4).join(' · ') + (ks.length > 4 ? ' …' : '') : '';
  }

  function tile(label, n, tone, sub) {
    return '<div class="stat' + (tone ? ' tone-' + tone : '') + '"><div class="l">' + esc(label) + '</div><div class="n">' + n + '<small>건</small></div><div class="s">' + esc(sub) + '</div></div>';
  }

  function sampleCard() {
    const withWant = st.docs.filter(d => d.sample && d.sample.want && !d.fixed_by_human);
    const fixed = st.docs.filter(d => d.sample && d.sample.want && d.fixed_by_human).length;
    if (!withWant.length) return '';
    const hit = {client: 0, category: 0, doc_type: 0, period: 0, all: 0};
    for (const d of withWant) {
      let all = true;
      for (const [k] of AXES) { const ok = (d[k] || '') === (d.sample.want[k] || ''); if (ok) hit[k]++; else all = false; }
      if (all) hit.all++;
    }
    const n = withWant.length;
    let h = '<div class="card"><div class="card-head"><h3>샘플 정답 대조</h3><span class="muted small">규칙엔진 판정 vs 샘플 정답 · ' + n + '건</span></div>';
    h += '<div class="acc">' + AXES.map(([k, name]) => '<div class="b"><span>' + name + '</span><div class="track"><div class="fill" style="width:' + pct(hit[k], n) + '%"></div></div><span class="v">' + hit[k] + '/' + n + '</span></div>').join('')
      + '<div class="b"><b>4축 전부</b><div class="track"><div class="fill" style="width:' + pct(hit.all, n) + '%"></div></div><span class="v"><b>' + hit.all + '/' + n + '</b></span></div></div>';
    h += '<p class="note">정답은 체험용 샘플에만 있습니다 — 실제 사무소 파일에는 없고, 그래서 확인 큐가 있습니다. 목표에 못 미치는 값을 고치지 않고 그대로 보여드립니다.'
       + (fixed ? ' 사람이 고쳐서 승인한 ' + fixed + '건은 대조에서 뺐습니다.' : '') + '</p></div>';
    return h;
  }

  function renderInbox(main, c) {
    const rows = st.docs.filter(d => (filter === 'all' || d.state === filter) && matches(d));
    let h = '<section><div class="chips">';
    for (const [k, name] of [['all', '전체'], ['ready', '확정'], ['held', '보류'], ['approved', '이동완료'], ['rejected', '거절']]) {
      const n = k === 'all' ? c.total : c[k];
      h += '<button class="chip" data-filter="' + k + '" aria-pressed="' + (filter === k) + '">' + name + '<span class="cnt">' + n + '</span></button>';
    }
    h += '<span class="right">' + rows.length + '건 표시' + (query ? ' · 「' + esc(query) + '」' : '') + '</span></div>';
    h += '<div class="table-wrap"><table class="data"><thead><tr><th>상태</th><th>파일명</th><th>형식</th><th>거래처</th><th>서류 종류</th><th>기간</th><th class="n">모델 초</th><th></th></tr></thead><tbody>';
    if (!rows.length) h += '<tr><td colspan="8"><div class="empty">' + (query ? '검색 결과가 없습니다' : '서류가 없습니다') + '</div></td></tr>';
    for (const d of rows) {
      h += '<tr class="row" data-id="' + esc(d.id) + '" aria-selected="' + (d.id === selected) + '">'
        + '<td>' + badge(d.state) + '</td>'
        + '<td class="file ell" title="' + esc(d.name) + '">' + esc(d.name) + '</td>'
        + '<td>' + esc(kindOf(d)) + '</td>'
        + '<td>' + cell(d.client, d.pred && d.pred.client) + '</td>'
        + '<td>' + cell(d.doc_type, d.pred && d.pred.doc_type) + '</td>'
        + '<td class="num">' + cell(d.period, d.pred && d.pred.period) + '</td>'
        + '<td class="n">' + (d.label_s ? d.label_s.toFixed(1) : '<span class="faint">—</span>') + '</td>'
        + '<td>' + (d.live ? '<span class="badge badge-live">지금 잰 값</span>' : d.fixed_by_human ? '<span class="badge badge-gray">사람이 고침</span>' : '') + '</td></tr>';
    }
    h += '</tbody></table></div>';
    h += '<p class="note">파일명은 실제로 들어오는 그대로입니다 — 어느 거래처의 몇 월 서류인지는 열어봐야 압니다. 행을 누르면 모델이 낸 값과 규칙엔진의 판정, 보류 사유, 모델이 읽은 본문을 볼 수 있습니다.'
       + (st.mode === 'demo' ? ' 체험은 우리가 준비한 샘플 서류(가명)만 다루고 방문자의 파일은 받지 않습니다.' : '') + '</p></section>';
    main.innerHTML = h;
    $$('.chip', main).forEach(b => b.addEventListener('click', () => { filter = b.dataset.filter; render(); }));
    $$('tr.row', main).forEach(tr => tr.addEventListener('click', () => openDoc(tr.dataset.id)));
  }

  function cell(v, raw) {
    if (v) return esc(v);
    if (raw) return '<span class="muted">' + esc(raw) + '</span>';
    return '<span class="faint">—</span>';
  }

  function renderQueue(main, c) {
    const held = st.docs.filter(d => d.state === 'held' && matches(d));
    const ready = st.docs.filter(d => d.state === 'ready' && matches(d));
    let h = '<section><div class="sec-head"><div><h2>보류 ' + c.held + '건</h2><p class="sub">모델의 확신이 낮거나 규칙과 어긋난 서류입니다. 라벨을 고쳐서 승인하면 그 수정이 별칭으로 규칙에 되돌아갑니다.</p></div>'
      + (c.ready ? '<button class="btn btn-primary btn-sm" id="approve-all"' + (readonly ? ' disabled' : '') + '><svg class="ico sm" aria-hidden="true"><use href="#i-check"/></svg>확정 ' + c.ready + '건 전부 승인</button>' : '') + '</div>';
    if (!held.length) h += '<div class="card"><div class="empty">' + (query ? '검색 결과가 없습니다' : '보류된 서류가 없습니다') + '</div></div>';
    h += '<div class="q">';
    for (const d of held) {
      h += '<div class="qcard" data-id="' + esc(d.id) + '"><div>'
        + '<div class="file">' + esc(d.name) + ' <span class="muted" style="font-weight:400;font-family:var(--sans);font-size:.8rem">' + esc(kindOf(d)) + '</span></div>'
        + '<div class="labels">' + esc(labelLine(d) || '(라벨 없음)') + '</div>'
        + '<ul class="why">' + reasonText(d).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>'
        + '<div class="act"><button class="btn btn-primary btn-sm" data-act="fix">고쳐서 승인</button>'
        + '<button class="btn btn-secondary btn-sm" data-act="reject"' + (readonly ? ' disabled' : '') + '>거절</button>'
        + '<button class="btn btn-ghost btn-sm" data-act="open">자세히</button></div>'
        + fixForm(d, true) + '</div>';
    }
    h += '</div>';
    if (ready.length) {
      h += '<div class="sec-head" style="margin-top:1.5rem"><div><h2>확정 ' + ready.length + '건 — 승인 대기</h2><p class="sub">모델과 규칙엔진이 합의한 서류입니다. 승인하면 아래 경로로 옮겨집니다.</p></div></div>';
      h += '<div class="table-wrap ready-list"><table class="data"><thead><tr><th>파일명</th><th>옮겨질 경로</th><th class="n">모델 초</th><th></th></tr></thead><tbody>';
      for (const d of ready) h += '<tr><td class="file ell" title="' + esc(d.name) + '"><a href="#" class="open-doc" data-id="' + esc(d.id) + '" style="color:inherit">' + esc(d.name) + '</a></td>'
        + '<td class="mono ell" title="' + esc(d.target || '') + '">' + esc(d.target || '') + '</td><td class="n">' + (d.label_s ? d.label_s.toFixed(1) : '—') + '</td>'
        + '<td style="text-align:right"><button class="btn btn-secondary btn-sm" data-approve="' + esc(d.id) + '"' + (readonly ? ' disabled' : '') + '>승인</button></td></tr>';
      h += '</tbody></table></div>';
    }
    h += '</section>';
    main.innerHTML = h;
    const all = $('#approve-all');
    if (all) all.addEventListener('click', approveAll);
    $$('.qcard', main).forEach(card => {
      const id = card.dataset.id;
      $$('[data-act]', card).forEach(b => b.addEventListener('click', ev => {
        const act = ev.currentTarget.dataset.act;
        if (act === 'open') openDoc(id);
        else if (act === 'fix') $('.fix', card).classList.toggle('open');
        else if (act === 'reject') doReject(id);
      }));
      $('.fix', card).addEventListener('submit', ev => { ev.preventDefault(); doFix(id, ev.currentTarget); });
      $('[data-act="fix-close"]', card).addEventListener('click', () => $('.fix', card).classList.remove('open'));
    });
    $$('[data-approve]', main).forEach(b => b.addEventListener('click', () => doApprove(b.dataset.approve)));
    $$('.open-doc', main).forEach(a => a.addEventListener('click', ev => { ev.preventDefault(); openDoc(a.dataset.id); }));
  }

  function fixForm(d, inline) {
    const opt = (list, cur) => '<option value="">(그대로)</option>' + (list || []).map(x => '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
    return '<form class="fix">'
      + '<div class="field"><label>거래처</label><select name="client">' + opt(st.registry, d.client) + '</select></div>'
      + '<div class="field"><label>서류 종류</label><select name="doc_type">' + opt(st.vocab.doc_types, d.doc_type) + '</select></div>'
      + '<div class="field"><label>기간</label><input type="text" name="period" placeholder="2026-08 · 2026-Q2 · 2025 · PERMANENT" value="' + esc(d.period || '') + '"></div>'
      + '<div class="row-actions"><button type="submit" class="btn btn-primary btn-sm"' + (readonly ? ' disabled' : '') + '>고친 라벨로 승인</button>'
      + '<button type="button" class="btn btn-ghost btn-sm" data-act="fix-close">닫기</button></div></form>';
  }

  function renderOrganized(main, c) {
    const moved = st.docs.filter(d => d.state === 'approved').sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
    let h = '<section><div class="org">';
    h += '<div class="card"><div class="card-head"><h3>폴더</h3><span class="muted small">' + (st.tree.length ? st.tree.length + '개 파일' : '비어 있음') + '</span></div>';
    if (!st.tree.length) h += '<div class="empty" style="padding:2rem 0">승인한 서류가 여기로 옮겨집니다</div>';
    else h += '<ul class="tree">' + treeHtml(buildTree(st.tree)) + '</ul>';
    h += '<p class="note">승인한 서류는 <code>[거래처]/00_기본서류</code> 또는 <code>[거래처]/[연도]/01～04</code> 폴더로, <code>[거래처]_[귀속시기]_[서류명]</code> 이름으로 옮겨집니다. 원본은 지워지지 않고 되돌릴 수 있습니다.</p></div>';
    h += '<div class="card"><div class="card-head"><h3>이동한 파일</h3><span class="muted small">' + (c.approved ? '이동 ' + c.approved + '건' : '') + '</span></div>';
    if (!moved.length) h += '<div class="empty" style="padding:2rem 0">아직 옮긴 서류가 없습니다 — <a href="#/queue">확인 큐</a>에서 승인하면 여기에 쌓입니다</div>';
    else {
      h += '<div class="table-wrap" style="box-shadow:none"><table class="data"><thead><tr><th>정리된 경로</th><th>원본 파일명</th><th class="nowrap">이동 시각</th></tr></thead><tbody>';
      for (const d of moved) h += '<tr class="row" data-id="' + esc(d.id) + '"><td class="mono">' + pathHtml(d.target || '') + (d.renamed ? ' <span class="badge badge-gray">번호 붙임</span>' : '') + '</td>'
        + '<td class="file ell" title="' + esc(d.name) + '">' + esc(d.name) + (d.fixed_by_human ? ' <span class="badge badge-gray">사람이 고침</span>' : '') + '</td><td class="num muted nowrap">' + esc(fmtTs(d.ts)) + '</td></tr>';
      h += '</tbody></table></div>';
    }
    h += '</div></div></section>';
    main.innerHTML = h;
    $$('tr.row', main).forEach(tr => tr.addEventListener('click', () => openDoc(tr.dataset.id)));
    lastTree = new Set(st.tree);
  }

  function buildTree(paths) {
    const root = {};
    for (const p of paths) {
      let node = root;
      const parts = p.split('/');
      parts.forEach((seg, i) => { if (i === parts.length - 1) node[seg] = p; else { node[seg] = node[seg] || {}; node = node[seg]; } });
    }
    return root;
  }
  function treeHtml(node) {
    let h = '';
    for (const k of Object.keys(node).sort()) {
      if (typeof node[k] === 'string') {
        const isNew = lastTree.size && !lastTree.has(node[k]);
        h += '<li><span class="file' + (isNew ? ' new' : '') + '"><svg class="ico sm" aria-hidden="true"><use href="#i-file"/></svg>' + esc(k) + '</span></li>';
      } else {
        h += '<li><details open><summary><span class="dir"><svg class="ico sm chev" aria-hidden="true"><use href="#i-chevron"/></svg><svg class="ico sm" aria-hidden="true"><use href="#i-folder"/></svg>' + esc(k) + '</span></summary><ul>' + treeHtml(node[k]) + '</ul></details></li>';
      }
    }
    return h;
  }
  function pathHtml(p) { return p.split('/').map(esc).join('<span class="sep faint"> / </span>'); }

  function renderClients(main, c) {
    const per = {};
    for (const name of (st.registry || [])) per[name] = {total: 0, ready: 0, held: 0, approved: 0};
    for (const d of st.docs) { const k = d.client; if (!k) continue; per[k] = per[k] || {total: 0, ready: 0, held: 0, approved: 0}; per[k].total++; if (per[k][d.state] != null) per[k][d.state]++; }
    const unreg = st.docs.filter(d => !d.client && d.state === 'held').length;
    let h = '<section><div class="sec-head"><div><h2>등록 거래처 ' + (st.registry || []).length + '곳</h2><p class="sub">이 목록이 규칙엔진의 안전장치입니다 — 모델이 「한빚나루식당」이라고 읽어도 목록과 대조해 「한빛나루식당」으로 붙입니다.</p></div></div>';
    h += '<div class="table-wrap"><table class="data"><thead><tr><th>거래처</th><th class="n">서류</th><th class="n">확정</th><th class="n">보류</th><th class="n">이동 완료</th></tr></thead><tbody>';
    for (const [name, v] of Object.entries(per).sort((a, b) => a[0].localeCompare(b[0], 'ko'))) {
      h += '<tr><td>' + esc(name) + ((st.registry || []).includes(name) ? '' : ' <span class="badge badge-gray">미등록</span>') + '</td><td class="n">' + v.total + '</td><td class="n">' + v.ready + '</td><td class="n">' + v.held + '</td><td class="n">' + v.approved + '</td></tr>';
    }
    if (unreg) h += '<tr><td class="muted">거래처를 못 정한 서류</td><td class="n">' + unreg + '</td><td class="n">—</td><td class="n">' + unreg + '</td><td class="n">—</td></tr>';
    h += '</tbody></table></div>';
    h += '<div class="callout" style="margin-top:1.25rem"><b>별칭은 확인 큐의 수정에서 학습됩니다.</b> 보류된 서류의 거래처를 고쳐서 승인하면 모델이 냈던 이름이 그 거래처의 별칭으로 등록되고, 다음부터는 규칙엔진이 자동으로 대조합니다.'
       + (st.mode === 'local' ? ' 거래처 등록은 <code>python3 -m engine init</code>의 <code>--clients</code>로 합니다(화면 등록은 준비 중).' : ' 체험에서는 샘플 서류의 거래처 5곳이 미리 등록돼 있습니다.') + '</div></section>';
    main.innerHTML = h;
  }

  function renderDevice(main, c) {
    const m = st.recorded || {};
    const live = st.docs.filter(d => d.live);
    const pp = st.docs.map(d => d.pp_tps).filter(Boolean), tg = st.docs.map(d => d.tg_tps).filter(Boolean);
    const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
    let h = '<section><div class="two">';
    h += '<div class="card"><div class="card-head"><h3>인스턴스</h3>' + (readonly ? '<span class="badge badge-rejected">미응답</span>' : '<span class="badge ' + (st.model_alive ? 'badge-ready' : 'badge-rejected') + '">' + (st.model_alive ? '모델 응답 중' : '모델 미응답') + '</span>') + '</div>';
    h += '<dl class="kv"><dt>기기</dt><dd>' + esc(st.device || m.device || '—') + '</dd><dt>모델</dt><dd>' + esc(m.model_file || st.model || '—') + '</dd>'
      + '<dt>스레드</dt><dd>' + (m.threads || '—') + '</dd><dt>모드</dt><dd>' + (st.mode === 'demo' ? '체험 — 샘플만, 방문자별 샌드박스' : '로컬 — 이 PC의 작업공간') + '</dd>'
      + '<dt>대기열</dt><dd>' + (readonly ? '—' : st.queue_len + '건 (한 번에 한 건만 돕니다)') + '</dd>'
      + '<dt>외부 API 호출</dt><dd>0 — 서류는 기기를 떠나지 않습니다</dd></dl></div>';
    h += '<div class="card"><div class="card-head"><h3>미리 잰 기록</h3><span class="muted small">' + esc(fmtTs(m.recorded_at)) + '</span></div>';
    h += '<dl class="kv"><dt>기기</dt><dd>' + esc(m.device || '—') + '</dd><dt>모델 파일</dt><dd>' + esc(m.model_file || '—') + '</dd><dt>서류</dt><dd>' + (m.count || st.docs.length) + '건</dd>'
      + '<dt>평균 pp / tg</dt><dd>' + mean(pp).toFixed(1) + ' / ' + mean(tg).toFixed(1) + ' tok/s</dd>'
      + '<dt>이 세션에서 다시 잼</dt><dd>' + live.length + '건' + (live.length ? ' · 평균 ' + mean(live.map(d => d.label_s)).toFixed(1) + '초' : '') + '</dd></dl>';
    h += '<p class="note">「지금 이 기기에서 다시 재기」는 이 인스턴스가 그 자리에서 모델을 돌립니다 — 서류 1건에 수십 초가 걸리고, 여럿이 누르면 줄을 섭니다.</p>';
    h += '<p style="margin:1rem 0 0"><a class="btn btn-secondary btn-sm" href="../phone/">다른 기기 벤치마크 보기</a></p></div>';
    h += '</div></section>';
    main.innerHTML = h;
  }

  // ---------------------------------------------------------- 드로어
  function openDoc(id) {
    if (!byId(id)) return;
    if (selected !== id) stopStream();
    selected = id;
    renderDrawer();
    document.body.classList.add('drawer-open');
    $('#drawer').setAttribute('aria-hidden', 'false');
    $$('tr.row').forEach(tr => tr.setAttribute('aria-selected', tr.dataset.id === id));
  }
  function closeDrawer() {
    document.body.classList.remove('drawer-open');
    $('#drawer').setAttribute('aria-hidden', 'true');
    $$('tr.row').forEach(tr => tr.setAttribute('aria-selected', 'false'));
    selected = null;
    stopStream();
  }

  function renderDrawer() {
    const box = $('#drawer');
    const d = byId(selected);
    if (!d) { box.innerHTML = ''; return; }
    const want = d.sample && d.sample.want;
    const pred = d.pred || {};
    const ruled = {client: d.client, category: d.category, doc_type: d.doc_type, period: d.period};
    const busy = readonly;

    let h = '<div class="d-head"><div>' + badge(d.state) + (d.live ? ' <span class="badge badge-live">지금 잰 값</span>' : '') + (d.fixed_by_human ? ' <span class="badge badge-gray">사람이 고침</span>' : '')
      + '<div class="file" style="margin-top:.4rem">' + esc(d.name) + '</div><div class="kind">' + esc(kindOf(d)) + (d.sample && d.sample.note ? ' · ' + esc(d.sample.note) : '') + (d.how ? ' · ' + esc(d.how) : '') + '</div></div>'
      + '<button class="btn btn-ghost btn-sm close" id="d-close" aria-label="닫기"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div>';
    h += '<div class="d-body">';
    h += '<h4>라벨</h4><table class="axes"><thead><tr><th></th><th>모델이 낸 값</th><th>규칙엔진 판정</th>' + (want ? '<th>샘플 정답</th>' : '') + '</tr></thead><tbody>';
    for (const [k, name] of AXES) {
      const raw = pred[k] == null ? '' : String(pred[k]);
      const val = ruled[k] == null ? '' : String(ruled[k]);
      let cell;
      if (!val) cell = '<span class="faint">—</span>';
      else if (want && want[k] !== val) cell = '<mark>' + esc(val) + '</mark>';
      else cell = esc(val);
      if (k === 'client' && d.client_how) cell += '<div class="muted" style="font-size:.74rem">' + esc(HOW[d.client_how] || d.client_how) + (d.client_how === 'fuzzy' && d.client_score ? ' ' + d.client_score : '') + '</div>';
      h += '<tr><th>' + name + '</th><td class="raw">' + (raw ? esc(raw) : '<span class="faint">—</span>') + '</td><td>' + cell + '</td>' + (want ? '<td class="want">' + esc(want[k]) + '</td>' : '') + '</tr>';
    }
    h += '</tbody></table>';
    if (want) h += '<p class="note">노란 표시는 샘플 정답과 다른 값입니다. 정답은 체험용 샘플에만 있습니다.</p>';

    h += '<h4>판정</h4>';
    if (d.state === 'held') h += '<div style="color:var(--amber);font-weight:600">보류 — 사람이 확인해야 합니다</div><ul class="why">' + reasonText(d).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
    else if (d.state === 'approved') h += '<div style="color:var(--blue);font-weight:600">승인 · 이동 완료' + (d.fixed_by_human ? ' — 사람이 라벨을 고쳤습니다' : '') + '</div>';
    else if (d.state === 'rejected') h += '<div style="color:var(--red);font-weight:600">거절 — 파일은 받은 서류함에 그대로 있습니다</div>';
    else if (d.state === 'ready') h += '<div style="color:var(--green);font-weight:600">확정 — 승인하면 아래 경로로 옮겨집니다</div>';
    if (d.target) h += '<div class="target" style="margin-top:.6rem"><span class="sep">정리됨 / </span>' + pathHtml(d.target) + '</div>';

    h += '<div class="act">';
    if (d.state === 'ready') h += '<button class="btn btn-primary btn-sm" data-act="approve"' + (busy ? ' disabled' : '') + '><svg class="ico sm" aria-hidden="true"><use href="#i-check"/></svg>승인하고 옮기기</button>';
    if (d.state === 'held' || d.state === 'ready' || d.state === 'rejected') h += '<button class="btn ' + (d.state === 'held' ? 'btn-primary' : 'btn-secondary') + ' btn-sm" data-act="fix"' + (busy ? ' disabled' : '') + '>라벨을 고쳐서 승인</button>';
    if (d.state === 'ready' || d.state === 'held') h += '<button class="btn btn-secondary btn-sm" data-act="reject"' + (busy ? ' disabled' : '') + '>거절</button>';
    if (d.state !== 'approved') h += '<button class="btn btn-ghost btn-sm" data-act="relabel"' + (busy ? ' disabled' : '') + '><svg class="ico sm" aria-hidden="true"><use href="#i-refresh"/></svg>지금 이 기기에서 다시 재기</button>';
    h += '</div>' + fixForm(d, false) + '<div class="progress" id="progress"></div>';

    h += '<h4>측정</h4><div class="meta">' + timing(d) + '</div>';
    h += '<details><summary>모델이 읽은 본문' + (d.chars ? ' · ' + d.chars + '자' : '') + '</summary><pre>' + esc(d.text_head || '(본문 없음)') + (d.text_head && d.chars > d.text_head.length ? '\n…' : '') + '</pre>'
       + '<div class="note" style="margin-top:.2rem">언어모델이 하는 일은 이 본문을 읽고 네 값을 JSON으로 내는 것뿐입니다. 거래처 대조·기간 검증·폴더 경로는 규칙엔진이 합니다.</div></details>';
    h += '</div>';
    box.innerHTML = h;
    $('#d-close').addEventListener('click', closeDrawer);
    $$('[data-act]', box).forEach(b => b.addEventListener('click', ev => {
      const act = ev.currentTarget.dataset.act;
      if (act === 'approve') doApprove(d.id);
      else if (act === 'reject') doReject(d.id);
      else if (act === 'fix') $('.fix', box).classList.add('open');
      else if (act === 'fix-close') $('.fix', box).classList.remove('open');
      else if (act === 'relabel') relabel(d);
    }));
    $('.fix', box).addEventListener('submit', ev => { ev.preventDefault(); doFix(d.id, ev.currentTarget); });
  }

  // ---------------------------------------------------------- 동작
  async function doApprove(id) {
    const d = byId(id);
    try { const r = await post('/docs/' + id + '/approve'); await load(); toast('승인 · 이동했습니다 → ' + (d.target || r.dst || ''), 'ok'); }
    catch (e) { toast(e.message, 'err'); }
  }
  async function doReject(id) {
    try { await post('/docs/' + id + '/reject', {why: st.mode === 'demo' ? '체험' : ''}); await load(); toast('거절했습니다 — 파일은 받은 서류함에 그대로 있습니다'); }
    catch (e) { toast(e.message, 'err'); }
  }
  async function doFix(id, form) {
    const fd = new FormData(form);
    const fix = {client: fd.get('client') || '', doc_type: fd.get('doc_type') || '', period: (fd.get('period') || '').trim()};
    try { await post('/docs/' + id + '/approve', fix); await load(); const d = byId(id); toast('고친 라벨로 승인 · 이동했습니다 → ' + (d && d.target || ''), 'ok'); }
    catch (e) { toast(e.message, 'err'); }
  }
  async function approveAll() {
    const ready = st.docs.filter(d => d.state === 'ready');
    let n = 0;
    for (const d of ready) { try { await post('/docs/' + d.id + '/approve'); n++; } catch (e) { toast(d.name + ': ' + e.message, 'err'); } }
    await load();
    toast(n + '건을 승인 · 이동했습니다', 'ok');
  }
  $('#undo').addEventListener('click', async () => {
    try { const r = await post('/undo'); await load(); toast('마지막 이동을 되돌렸습니다' + (r.rel_target ? ' — ' + r.rel_target : '')); }
    catch (e) { toast(e.message, 'err'); }
  });
  $('#scan').addEventListener('click', async () => {
    const b = $('#scan'); b.disabled = true;
    try { const r = await post('/scan'); await load(); toast('받은 서류함을 스캔했습니다 — 새 서류 ' + (r.scanned || 0) + '건', 'ok'); }
    catch (e) { toast(e.message, 'err'); }
    b.disabled = false;
  });

  function say(msg, err) {
    const p = $('#progress');
    if (!p) return;
    p.className = 'progress' + (err ? ' err' : '');
    p.innerHTML = msg;
  }
  function stopStream() { if (es) { es.close(); es = null; } }
  async function relabel(d) {
    stopStream();
    let r;
    try { r = await post('/docs/' + d.id + '/relabel'); } catch (e) { toast(e.message, 'err'); return; }
    say('<span class="pulse"></span>줄을 섰습니다…');
    es = new EventSource(apiBase + 'api/jobs/' + r.job + '/events');
    es.addEventListener('state', async ev => {
      const j = JSON.parse(ev.data);
      if (j.state === 'queued') say('<span class="pulse"></span>앞에 ' + j.position + '건 · ' + j.elapsed_s.toFixed(0) + '초 대기');
      else if (j.state === 'running') say('<span class="pulse"></span>모델이 읽는 중 · ' + j.elapsed_s.toFixed(1) + '초' + (d.label_s ? ' (미리 잰 값 ' + d.label_s.toFixed(1) + '초)' : ''));
      else if (j.state === 'done') { stopStream(); await load(); say('지금 이 기기에서 다시 쟀습니다 — ' + (j.row && j.row.label_s ? j.row.label_s.toFixed(1) + '초' : '')); toast('다시 쟀습니다 — ' + d.name, 'ok'); }
      else if (j.state === 'failed') { stopStream(); say('다시 재지 못했습니다: ' + esc(j.error), true); }
    });
    es.onerror = () => { stopStream(); load().then(() => say('연결이 끊겼습니다. 상태를 다시 불러왔습니다.', true)); };
  }

  function toast(msg, kind) {
    const w = $('#toasts');
    const t = document.createElement('div');
    t.className = 'toast' + (kind ? ' ' + kind : '');
    t.textContent = msg;
    w.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 3000);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  }

  // ---------------------------------------------------------- 라우팅
  function onHash() {
    const r = (location.hash || '#/dashboard').replace(/^#\/?/, '').split('/')[0];
    route = TITLES[r] ? r : 'dashboard';
    if (st) render();
  }
  window.addEventListener('hashchange', onHash);
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && selected) closeDrawer(); });
  $('#q').addEventListener('input', ev => { query = ev.target.value.trim(); if (st) render(); });

  onHash();
  load();
})();
</script>
</body>
</html>
